<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Costco retail intelligence: promotion impact and member churn</title>
  <desc id="desc">User-reported prototype architecture. Azure SQL stores enter bronze through a JDBC notebook. Sales, product, and promotion files in Unity Catalog volumes enter bronze through Auto Loader. A churn flat file enters bronze through a notebook. Silver promotion_Sales feeds gold promotions_impact with actual-versus-baseline metrics, category promotion success rates, and historical promotion analysis. A Random Forest notebook reads bronze churn data and writes global feature importance to silver model_findings. Genie queries both existing silver tables. Unity Catalog governs data; Databricks jobs orchestrate notebooks.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#526879"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .title { font-size: 36px; font-weight: 700; }
      .sub { font-size: 19px; fill: #526879; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526879; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #526879; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #d6e1e8; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
